<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>宇宙画廊</title>
    <style>
        body { background-color: #1a1a2e; color: #fff; font-family: 'Microsoft YaHei'; padding: 30px; text-align: center;}
        .gallery-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 20px;}
        .gallery-item { background: #16213e; padding: 10px; border-radius: 10px; width: 300px;}
        .gallery-item img { width: 100%; border-radius: 5px; }
        .back-btn { display: inline-block; margin-top: 30px; padding: 10px 20px; background: #e94560; color: white; text-decoration: none; border-radius: 5px; }
    </style>
</head>
<body>
    <h2>韦伯望远镜下的宇宙</h2>
    <p>星云、星系与黑洞，宇宙的壮丽超乎想象。</p>
    
    <div class="gallery-container">
        <div class="gallery-item">
            <!-- 请确保 image/galaxy1.jpg 存在 -->
            <img src="../image/galaxy1.jpg" alt="星云">
            <p>绚丽星云</p>
        </div>
        <div class="gallery-item">
            <!-- 请确保 image/galaxy2.jpg 存在 -->
            <img src="../image/galaxy2.jpg" alt="星系">
            <p>螺旋星系</p>
        </div>
        <div class="gallery-item">
            <!-- 请确保 image/galaxy3.jpg 存在 -->
            <img src="../image/galaxy3.jpg" alt="深空">
            <p>深空天体</p>
        </div>
    </div>
    
    <a href="../index.html" class="back-btn">返回主页</a>
</body>
</html>
